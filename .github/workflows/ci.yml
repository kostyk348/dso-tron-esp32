name: CI

# Почему здесь host-проверка, а не сборка ESP-IDF:
# линковка прошивки упирается в архитектурную проблему (см. issue #1) —
# проект определяет sched_yield/sem_wait/sem_post, которые уже есть в
# libpthread из ESP-IDF (multiple definition), а intr_timer_enable()
# объявлен, но не реализован. Красный бейдж на каждой сборке не несёт
# информации, поэтому CI проверяет то, что проверяемо на хосте:
# синтаксис и объявления всех исходников компонента.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-syntax:
    name: host syntax check (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stub sdkconfig.h for host compile
        run: |
          mkdir -p .host-ci
          printf '#define CONFIG_DSO_MAX_TASKS 8\n' > .host-ci/sdkconfig.h

      - name: Syntax check every source (-Werror=implicit-function-declaration)
        run: |
          set -e
          for f in main/main.c components/dso_tron/src/*.c; do
            echo "== $f"
            gcc -fsyntax-only -Wall -Wextra -Werror=implicit-function-declaration \
              -I .host-ci -I components/dso_tron/include "$f"
          done
